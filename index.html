<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steven Fowler — Software Developer & Engineering Leader</title>
    <meta
      name="description"
      property="og:description"
      content="The personal site of Steven Fowler — Software Developer & Engineering Leader based in Charlottesville, Virginia."
    />
    <meta property="og:title" content="Steven Fowler — Software Developer & Engineering Leader" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stevenfowler.dev" />
    <meta property="og:image" content="https://stevenfowler.dev/assets/portrait.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Rubik:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark !== false;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8f9fc] text-[#283044] dark:bg-[#090b11] dark:text-[#c3cadb] antialiased selection:bg-[#7611a6] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
